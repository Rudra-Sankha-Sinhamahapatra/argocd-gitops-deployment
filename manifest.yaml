apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-week-39c3
  labels: 
    app: todo-app-week-39c3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app-week-39c3
  template:
    metadata:
      labels:
        app: todo-app-week-39c3
    spec:
      containers:
      - name: todo-app-week-39c3
        image: rudrasankha/todo-app-week-39c3:9ebb28c89b55c772564dfb74a71f8229cce33d7c
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-week-39c3-service
  labels:
    app: todo-app-week-39c3
spec:
  selector:
    app: todo-app-week-39c3
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-week-39c3-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - week35c3.rudrasankha.com
    secretName: week35c3-tls
  rules:
  - host: week35c3.rudrasankha.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-week-39c3-service
            port:
              number: 80  

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
 acme:
   server: https://acme-v02.api.letsencrypt.org/directory
   email: rssmp120@gmail.com
   privateKeySecretRef:
      name: letsencrypt-prod
   solvers:
   - http01:
       ingress:
         class: nginx
